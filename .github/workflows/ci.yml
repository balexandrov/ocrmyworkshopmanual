name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: ocrmypdf 17 requires it, and on 3.10 pip silently
        # resolves ocrmypdf 16, whose text layer extracts with doubled spaces --
        # a different product from the one every real install gets. 3.14 is what
        # development runs on.
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Ghostscript + jbig2enc are the two external binaries the pipeline
      # shells out to; both are found automatically via shutil.which (`gs`,
      # `jbig2`) once on PATH, no extra config needed.
      - name: Install Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript

      # Tesseract is what ocrmypdf shells out to. Without it every OCR test skips (or,
      # worse, fails) and the whole searchable-text half of the pipeline goes untested —
      # which is how several real OCR bugs reached the archive. osd = script detection
      # used by --language auto.
      - name: Install Tesseract
        run: |
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
          tesseract --version

      # No Debian/Ubuntu apt package ships the jbig2 CLI binary (only the
      # libjbig2enc-dev/libjbig2enc0t64 library packages exist) -- build it
      # from source, following upstream's own tested recipe.
      - name: Build and install jbig2enc
        run: |
          sudo apt-get install -y build-essential autoconf automake libtool libleptonica-dev
          git clone --depth 1 https://github.com/agl/jbig2enc.git /tmp/jbig2enc
          cd /tmp/jbig2enc
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          jbig2 -V

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile-check
        run: python -m py_compile *.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify packaging (pyproject.toml)
        run: |
          pip install --no-deps -e .
          ocrmyworkshopmanual --version
