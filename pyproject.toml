[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrmyworkshopmanual"
dynamic = ["version"]
description = "Turn a folder of scanned, image-only PDFs into small, searchable PDFs (JBIG2 + OCR) without wrecking photos or breaking in browsers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "balexandrov" }]
keywords = ["pdf", "ocr", "jbig2", "scan", "compression", "ocrmypdf", "ghostscript"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing",
]
dependencies = [
    "numpy",
    "scipy",
    "Pillow",
    "ocrmypdf>=17.13",
    "pypdf",
    "img2pdf",
    "fonttools",
]

[project.optional-dependencies]
test = ["pytest"]
# --ocr-engine paddle. For a GPU, install onnxruntime-directml (Windows, any DirectX 12 card)
# or onnxruntime-gpu (CUDA) INSTEAD of onnxruntime — they are one package under three names.
paddle = ["rapidocr", "onnxruntime"]
# --ocr-engine yomitoku. Needs Python < 3.14 (every YomiToku from 0.5.2 on does). For an
# NVIDIA GPU install a CUDA build of torch first (pytorch.org). YomiToku is CC BY-NC-SA 4.0:
# free for non-commercial use only.
yomitoku = ["yomitoku>=0.15; python_version < '3.14'"]

[project.urls]
Homepage = "https://github.com/balexandrov/ocrmyworkshopmanual"
Repository = "https://github.com/balexandrov/ocrmyworkshopmanual"

[project.scripts]
ocrmyworkshopmanual = "ocrmyworkshopmanual:main"
scan-candidates = "scan_candidates:main"
combine-manual = "combine_manual:main"

[tool.setuptools]
py-modules = ["ocrmyworkshopmanual", "scan_candidates", "combine_manual",
              "pdffonts", "pdflinks", "pdfspaces", "pdfwatermark", "pdfrepair",
              "ocrmypdf_paddle", "ocrmypdf_yomitoku"]

[tool.setuptools.dynamic]
version = { attr = "ocrmyworkshopmanual.__version__" }
