# Example config for ocrmyworkshopmanual.
#
# Copy to "ocrmyworkshopmanual.toml" next to where you run the tool (it's auto-loaded),
# or point at it with --config PATH. Keys are the long option names with dashes replaced
# by underscores. Any explicit CLI flag overrides the value here. Uncomment what you want.

# ── core ──────────────────────────────────────────────────────────────────────
dpi = 200                 # render resolution (native scans are usually ~200-220)
workers = 8               # files processed in parallel
# dest = "D:/compressed"  # output root (default: sibling "<src> (COMPRESSED)")
# limit = 0               # process only the first N files (0 = all)

# ── OCR ───────────────────────────────────────────────────────────────────────
language = "auto"         # "auto" detects each file's script; or e.g. "eng+fra+deu"
# no_ocr = false          # true = skip the searchable text layer
# ocr_only = false        # true = don't compress, only add OCR

# ── binarization (line/text pages) ────────────────────────────────────────────
sauvola_k = 0.30          # lower = bolder/thicker ink, higher = thinner/cleaner
# min_size = 10

# ── photo/colour pages ────────────────────────────────────────────────────────
jpeg_quality = 60
photo_dpi = 150
photo_descreen = 0.6      # 0 = skip only the halftone-smoothing blur (paper-whitening always runs)

# ── don't-degrade / routing ───────────────────────────────────────────────────
min_savings = 0.25
min_compress_mb = 5      # don't compress files smaller than this (MB) — the win is a few
                         # hundred KB against a lossy re-encode of every page. They are
                         # still checked for OCR and made searchable. 0 = compress everything

# ── born-digital optimisation (born-digital PDFs only) ────────────────────────
# These files are never rasterised; they are re-stored smaller (Flate the unfiltered streams,
# bundle objects, drop per-illustration authoring XMP), duplicate images are merged and
# losslessly stored images re-encoded as JPEG. The output is kept only if it verifies against
# the source. -62% on a 513 MB Subaru manual, -72% on a browser-printed Acura chapter.
born_digital = "full"        # copy | lossless | full | max
                             #   copy     = byte-for-byte
                             #   lossless = re-store + merge duplicate images; pages decode identically
                             #   full     = lossless + JPEG q85 for losslessly stored images
                             #   max      = full + zopfli (~700x the CPU; needs `pip install zopfli`)
# born_digital_min_mb = 5   # size floor for born-digital optimisation alone (default: min_compress_mb).
                            # Lower to sweep small born-digital files WITHOUT letting the raster
                            # path re-image small scans. Measured on this archive: the <5 MB band
                            # is 282,676 files / 19.2 GB for only -12%, ~10 h (I/O-bound), while
                            # the 5-50 MB band is 718 files / 12 GB for -36% in ~30 min.

# ── resilience / large collections ────────────────────────────────────────────
timeout = 600             # STALL timeout: seconds a step may make NO progress before it is
                          # treated as hung (not a time budget — a slow big file is never
                          # killed; OCR is not bounded by it at all). 0 = off
min_free_gb = 1.0         # abort if the dest drive has less than this free (0 = off)
# no_log = false
